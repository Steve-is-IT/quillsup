<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" width="816" height="1056" role="img" aria-labelledby="t d" lang="en">
<title id="t">Hackles: crisis and disclosure response flowchart</title><desc id="d">Steps for an adult when a student discloses something serious: First 10 Minutes; check for immediate danger or self-harm; never view or forward intimate images; report personally under school policy and law; preserve evidence under the three-case rule; support the student; document and follow up.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2B2D42"/></marker></defs>
<rect x="0" y="0" width="816" height="1056" fill="#FAF4E4"/>
<text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B2D42">Hackles: First 10 Minutes</text>
<text x="40" y="68" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#2B2D42">Crisis and disclosure response for staff and volunteers. Print it. Fill the dashed boxes for your site.</text>
<rect x="40" y="84" width="470" height="40" rx="20" fill="#FFC93C" stroke="#2B2D42" stroke-width="2"/>
<text x="50" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">A student tells you something serious, or you notice it.</text>
<text x="50" y="121.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42"></text>
<line x1="275" y1="124" x2="275" y2="140" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="140" width="470" height="136" rx="10" fill="#F2E9D2" stroke="#2B2D42" stroke-width="2"/>
<text x="50" y="161" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">1. First 10 Minutes</text>
<text x="50" y="177.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Stay calm. Soften your voice. Keep your face neutral.</text>
<text x="50" y="191" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Go somewhere private that other adults can still see.</text>
<text x="50" y="204.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Say: "Thank you for telling me. This is not your fault. You are not in trouble."</text>
<text x="50" y="218" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Listen. Ask only "Tell me more" and "What happened next?" No leading questions.</text>
<text x="50" y="231.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Do not promise secrecy: "I need to get you help, and I will tell you who I tell."</text>
<line x1="275" y1="276" x2="275" y2="292" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="275,292 440,332 275,372 110,332" fill="#FBE7A6" stroke="#2B2D42" stroke-width="2"/>
<text x="275" y="329" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2B2D42" text-anchor="middle">Anyone in immediate danger, or at risk</text>
<text x="275" y="342" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2B2D42" text-anchor="middle">of self-harm?</text>
<rect x="548" y="296" width="228" height="108" rx="10" fill="#F6D2C4" stroke="#2B2D42" stroke-width="2"/>
<text x="558" y="317" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">YES: act now</text>
<text x="558" y="333.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Stay with the student. Call 911 if in danger.</text>
<text x="558" y="347" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Follow the crisis protocol. Call or text 988 for</text>
<text x="558" y="360.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">self-harm. Bring in the counselor and</text>
<text x="558" y="374" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">administrator now.</text>
<line x1="440" y1="332" x2="548" y2="332" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<text x="486" y="326" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#2B2D42">YES</text>
<rect x="548" y="410" width="228" height="42" rx="10" fill="#FBE7A6" stroke="#2B2D42" stroke-width="2" stroke-dasharray="6 4"/>
<text x="558" y="431" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2B2D42">[Local: crisis line and on-call contact]</text>
<line x1="275" y1="372" x2="275" y2="396" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<text x="281" y="388" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#2B2D42">NO</text>
<polygon points="275,396 440,436 275,476 110,436" fill="#FBE7A6" stroke="#2B2D42" stroke-width="2"/>
<text x="275" y="433" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2B2D42" text-anchor="middle">Are intimate images involved, including</text>
<text x="275" y="446" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2B2D42" text-anchor="middle">AI fakes?</text>
<rect x="548" y="470" width="228" height="122" rx="10" fill="#F6D2C4" stroke="#2B2D42" stroke-width="2"/>
<text x="558" y="491" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">YES: never view it</text>
<text x="558" y="507.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Do not look, copy, forward, print or</text>
<text x="558" y="521" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">screenshot. Do not ask anyone to show you.</text>
<text x="558" y="534.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Secure the device as policy directs and</text>
<text x="558" y="548" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">hand it to the designated person. Keep only</text>
<text x="558" y="561.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">the surrounding words.</text>
<line x1="440" y1="436" x2="588" y2="470" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<line x1="275" y1="476" x2="275" y2="500" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<text x="281" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#2B2D42">NO or unsure</text>
<rect x="40" y="500" width="470" height="96" rx="10" fill="#F2E9D2" stroke="#2B2D42" stroke-width="2"/>
<text x="50" y="521" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">2. Report personally, per school policy and law</text>
<text x="50" y="537.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Report to child protective services or law enforcement as your state and policy require, promptly,</text>
<text x="50" y="551" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">without waiting for proof. Then tell the administrator and counselor. Telling a supervisor may not</text>
<text x="50" y="564.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">satisfy your own duty. Online exploitation: also the NCMEC CyberTipline.</text>
<rect x="548" y="598" width="228" height="70" rx="10" fill="#FBE7A6" stroke="#2B2D42" stroke-width="2" stroke-dasharray="6 4"/>
<text x="558" y="619" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2B2D42">[Local: reporting line, phone, deadline, backup</text>
<text x="558" y="632" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2B2D42">contact, who files the NCMEC report]</text>
<line x1="275" y1="596" x2="275" y2="612" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="612" width="470" height="140" rx="10" fill="#F2E9D2" stroke="#2B2D42" stroke-width="2"/>
<text x="50" y="633" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">3. Preserve evidence: the three-case rule</text>
<text x="50" y="649.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">1. Words and records (comments, threats, usernames, links, dates): screenshots and saved</text>
<text x="50" y="663" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">copies are fine. Keep them private. Never post or forward.</text>
<text x="50" y="676.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">2. Intimate or sexual pictures of anyone under 18, including fakes: do not capture, save or show</text>
<text x="50" y="690" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">anyone. Save only the words around them.</text>
<text x="50" y="703.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">3. Not sure which? Do not capture. Tell a trusted adult first. Telling matters more than saving.</text>
<line x1="275" y1="752" x2="275" y2="768" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="768" width="470" height="112" rx="10" fill="#F2E9D2" stroke="#2B2D42" stroke-width="2"/>
<text x="50" y="789" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">4. Support the student</text>
<text x="50" y="805.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Check in kindly, without pressing for details. Keep the counselor involved. Protect the student</text>
<text x="50" y="819" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">from gossip and retaliation. Families are told when and how the administrator and authorities</text>
<text x="50" y="832.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">advise, child's safety first. Do not pay anyone, do not delete the account or messages, do not</text>
<text x="50" y="846" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">confront the other person.</text>
<line x1="275" y1="880" x2="275" y2="896" stroke="#2B2D42" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="896" width="470" height="100" rx="10" fill="#F2E9D2" stroke="#2B2D42" stroke-width="2"/>
<text x="50" y="917" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">5. Document and follow up</text>
<text x="50" y="933.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Same day: write the child's exact words, the times, who you told, and what you did, on the</text>
<text x="50" y="947" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">confidential form. Facts only. Check in after 24 hours, 1 week and 1 month. Debrief with the</text>
<text x="50" y="960.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">counselor: you did your job.</text>
<rect x="548" y="700" width="228" height="170" rx="10" fill="#FBE7A6" stroke="#2B2D42" stroke-width="2"/>
<text x="558" y="721" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">Do not</text>
<text x="558" y="737.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Show shock or disgust.</text>
<text x="558" y="751" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Ask "Why did you...?"</text>
<text x="558" y="764.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Promise secrecy or outcomes.</text>
<text x="558" y="778" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Investigate or contact the other person.</text>
<text x="558" y="791.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Stay alone behind a closed door with a child.</text>
<text x="558" y="805" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Assume that telling the principal is enough.</text>
<text x="558" y="818.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#2B2D42">Punish the student for telling.</text>
<rect x="548" y="880" width="228" height="116" rx="10" fill="#FBE7A6" stroke="#2B2D42" stroke-width="2" stroke-dasharray="6 4"/>
<text x="558" y="901" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B2D42">Our contacts</text>
<text x="558" y="917" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2B2D42">Administrator on call: ____________</text>
<text x="558" y="930" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2B2D42">Counselor: ____________</text>
<text x="558" y="943" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2B2D42">Reporting line: ____________</text>
<text x="558" y="956" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2B2D42">Backup: ____________</text>
<text x="40" y="1020" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2B2D42">General guidance, not legal advice. Reporting duties vary by state and district. Hackles has not been reviewed by a state agency. [VERIFY; COUNSEL TO CONFIRM]</text>
<text x="40" y="1034" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#2B2D42">© 2026 Competence Collective. Lesson text and teaching materials CC BY-NC 4.0. The Hackles name, logos, characters and artwork are not covered by that license:</text>
<text x="40" y="1045" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#2B2D42">print and share them unaltered for classroom and family use; any other use needs written permission. [VERIFY with counsel]</text>
</svg>